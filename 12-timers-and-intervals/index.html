<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>java script</title>
</head>

<body>

    <h1>timers and intervals</h1>
    <hr>

    <!-- set time out example -->
    <h2>set-timeout</h2>
    <button id="timeout-btn">Show message</button>
    <p id="timeout-message"></p>
    <hr>


    <!-- clear time out example -->
    <h2>clear-timeout</h2>
    <button id="start-timeout-btn">Start</button>
    <button id="cancel-timeout-btn">Cancel</button>

    <p id="timer-start"></p>
    <p id="timeout-status"></p>
    <hr>


    <!-- set interval & clear interval example -->
    <h2>set-interval & clear-interval</h2>
    <h3 id="interval-counter">0</h3>
    <button id="start-interval-btn">Start counter</button>
    <button id="stop-interval-btn">Stop counter</button>
    <hr>

    <script src="script.js"></script>
</body>

</html>
